version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # crmleaf/payroll-core is versioned in lockstep with this package by a
      # shared release tag, so an automated bump would either be a no-op or
      # would break the pairing. It moves when this package moves.
      - dependency-name: "crmleaf/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
