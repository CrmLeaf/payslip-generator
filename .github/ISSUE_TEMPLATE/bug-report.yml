name: Bug report
description: Something is broken that is not a wrong figure.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For an incorrect figure please use the **Incorrect calculation**
        template - it asks for the citation we need to turn the report into a
        test.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "crmleaf/payslip-generator 1.0.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the full error and stack trace if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      render: php
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true

  - type: input
    id: laravel
    attributes:
      label: Laravel version
      description: Leave blank if you are using the calculator without Laravel.
