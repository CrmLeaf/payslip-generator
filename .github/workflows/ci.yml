name: CI

# This package's own CI. It proves that crmleaf/payslip-generator
# installs and passes on its own, with nothing else from the suite present,
# which is the whole promise of a tool you can require by itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # Prove the documented floor still installs and passes.
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, bcmath, dom, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Validate package.json
        run: node --input-type=module -e "import('node:fs').then(fs => JSON.parse(fs.readFileSync('package.json', 'utf8')))"

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpstan analyse --no-progress

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The gitleaks binary rather than the wrapper action: the action requires a
      # paid licence once the repository belongs to an organisation, and fails on
      # the licence check rather than on anything in the code.
      - name: Scan the history for committed credentials
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            zricethezav/gitleaks:latest detect --source=/repo \
            --config=/repo/.gitleaks.toml --redact --exit-code=1
